<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <style>
        .bar { margin: 10px; padding: 10px; border: 1px solid #ccc; }
        .box { margin: 10px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Debug Test</h1>
    
    <h2>Skills:</h2>
    <div id="skillsContainer"></div>
    
    <h2>Projects:</h2>
    <div id="work">
        <div class="box-container"></div>
    </div>
    
    <script>
        console.log("Debug script started");
        
        async function fetchData(type = "skills") {
            try {
                let response
                type === "skills" ?
                    response = await fetch("skills.json")
                    :
                    response = await fetch("./projects/projects.json")
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log(`${type} data loaded:`, data);
                return data;
            } catch (error) {
                console.error(`Error loading ${type}:`, error);
                return [];
            }
        }

        function showSkills(skills) {
            let skillsContainer = document.getElementById("skillsContainer");
            if (!skillsContainer) {
                console.error("Skills container not found!");
                return;
            }
            
            let skillHTML = "";
            skills.forEach(skill => {
                skillHTML += `
                <div class="bar">
                      <div class="info">
                        <img src="${skill.icon}" alt="skill" width="48" height="48" />
                        <span>${skill.name}</span>
                      </div>
                    </div>`
            });
            skillsContainer.innerHTML = skillHTML;
            console.log("Skills loaded successfully");
        }

        function showProjects(projects) {
            let projectsContainer = document.querySelector("#work .box-container");
            if (!projectsContainer) {
                console.error("Projects container not found!");
                return;
            }
            
            let projectHTML = "";
            const filteredProjects = projects.slice(0, 5);
            console.log("Filtered projects:", filteredProjects);
            
            filteredProjects.forEach(project => {
                projectHTML += `
                <div class="box">
                  <h3>${project.name}</h3>
                  <p>${project.desc}</p>
                  <a href="${project.links.view}" target="_blank">View</a>
                </div>`
            });
            projectsContainer.innerHTML = projectHTML;
            console.log("Projects loaded successfully");
        }
        
        // Load data
        console.log("Starting to load data...");
        
        fetchData().then(data => {
            console.log("Loading skills...");
            if (data && data.length > 0) {
                showSkills(data);
            } else {
                console.log("No skills data found");
            }
        }).catch(error => {
            console.error("Error loading skills:", error);
        });

        fetchData("projects").then(data => {
            console.log("Loading projects...");
            if (data && data.length > 0) {
                showProjects(data);
            } else {
                console.log("No projects data found");
            }
        }).catch(error => {
            console.error("Error loading projects:", error);
        });
    </script>
</body>
</html>
